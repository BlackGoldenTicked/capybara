<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 280px; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; margin: 0; padding: 14px; color: #1a1a18; }
      h1 { font-size: 14px; margin: 0 0 10px; font-weight: 500; }
      button { font: inherit; border: 0.5px solid #888780; background: transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; width: 100%; margin-bottom: 8px; }
      button:hover { background: #f1f0eb; }
      p { color: #5f5e5a; margin: 4px 0; }
      .status { font-size: 12px; color: #1d9e75; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>ReadFlow Clip</h1>
    <button id="pair">配对到本地客户端</button>
    <button id="sync">同步当前页可见推文</button>
    <p class="status" id="status"></p>
    <p style="font-size:11px;color:#888780;margin-top:8px">在 x.com 打开后，每条推文右下会出现"存入阅流"按钮。</p>
    <script src="popup.js"></script>
  </body>
</html>
