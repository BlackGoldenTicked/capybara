<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2e"/>
      <stop offset="0.55" stop-color="#20243f"/>
      <stop offset="1" stop-color="#0e2e2c"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54c8a6"/>
      <stop offset="1" stop-color="#6ea8ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6ea8ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#54c8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#54c8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="660" height="440" fill="url(#bg)"/>
  <!-- 柔光装饰 -->
  <circle cx="150" cy="120" r="150" fill="#4a3fb0" opacity="0.20" filter="url(#soft)"/>
  <circle cx="540" cy="340" r="170" fill="#179e74" opacity="0.18" filter="url(#soft)"/>

  <!-- 图标本影，引导视线 -->
  <circle cx="229" cy="214" r="92" fill="url(#glow)"/>
  <circle cx="519" cy="214" r="92" fill="url(#glow2)"/>

  <!-- 品牌 -->
  <text x="40" y="58" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="1">阅流 ReadFlow</text>
  <text x="42" y="84" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif" font-size="14" fill="#b9b7ad">个人知识 Pipeline · 浏览 收藏 组织 输出</text>

  <!-- 引导曲线箭头：从 ReadFlow.app 指向 Applications -->
  <path d="M 298 214 C 345 118, 435 118, 478 214" fill="none" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
  <!-- 箭头头部（指向右侧 Applications） -->
  <path d="M 462 198 L 490 214 L 462 230" fill="none" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部提示 -->
  <text x="330" y="404" text-anchor="middle" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fe3cf">将 ReadFlow 拖入 Applications 文件夹即可完成安装</text>
</svg>
